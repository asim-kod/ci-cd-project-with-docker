version: '3.8'

services:
  jenkins-server:
    build: ./jenkins
    image: jenkins-server:latest
    container_name: jenkins-server
    hostname: jenkins-server
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
    networks:
      - cicd-net

  ansible-server:
    build: ./ansible
    image: ansible-server:latest
    container_name: ansible-server
    hostname: ansible-server
    privileged: true
    volumes:
      - ansible-data:/var/lib/docker
    networks:
      - cicd-net

  eks-server:
    build: ./kubernetes
    image: eks-server:latest
    container_name: eks-server
    hostname: eks-server
    ports:
      - "8085:8085"
    privileged: true
    cgroup: host
    volumes:
      - /lib/modules:/lib/modules:ro 
      - /sys/fs/cgroup:/sys/fs/cgroup:rw 
      - k8s-data:/var/lib/docker
    networks:
      - cicd-net

volumes:
  jenkins-data:
    name: jenkins-data
    driver: local
  ansible-data:
    name: ansible-data
    driver: local
  k8s-data:
    name: k8s-data
    driver: local

networks:
  cicd-net:
    name: cicd-net
    driver: bridge